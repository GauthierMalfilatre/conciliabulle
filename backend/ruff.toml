line-length = 150
target-version = "py312"
extend-exclude = ["*/migrations/*", "staticfiles"]

[lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long lines are tolerated: no formatter enforces them

[lint.isort]
known-first-party = ["apps", "config"]
