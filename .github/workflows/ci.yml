name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Django system check
        run: python manage.py check
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: OpenAPI schema is valid
        run: python manage.py spectacular --validate --fail-on-warn --file openapi.yaml
      - name: Tests
        run: python manage.py test
      - name: Publish the OpenAPI schema (for the front)
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: backend/openapi.yaml

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build backend
