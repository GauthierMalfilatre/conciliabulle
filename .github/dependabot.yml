version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    labels: [dependencies, backend]
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /front-end
    schedule:
      interval: weekly
    labels: [dependencies, frontend]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    labels: [dependencies, backend]
  - package-ecosystem: docker
    directory: /front-end
    schedule:
      interval: weekly
    labels: [dependencies, frontend]
